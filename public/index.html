<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spindle · listen → identify → log</title>
<style>
  :root { --paper:#f4ecd8; --black:#12100c; --red:#f0362b; --blue:#2b4cf0; --groove:#0c0c0c; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; color:var(--black);
    font-family:"Work Sans",system-ui,sans-serif;
    background: radial-gradient(#e7ddc4 1px, transparent 1px) 0 0/22px 22px, var(--paper);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  h1 { font-family:"Anton",system-ui,sans-serif; font-weight:900;
       font-size:clamp(48px,14vw,120px); margin:0; text-transform:uppercase;
       text-shadow:5px 5px 0 var(--red); letter-spacing:.01em; }
  h1 .s { color:var(--blue); text-shadow:5px 5px 0 var(--black); }
  p.tag { font-size:15px; letter-spacing:.14em; text-transform:uppercase; margin:.3em 0 2.2em; }

  /* --- the turntable: the listen button IS the record --- */
  #go {
    position:relative; width:268px; height:268px; padding:0; border:0; border-radius:50%;
    background:var(--black); cursor:pointer;
    box-shadow:0 0 0 4px var(--black), 14px 16px 0 rgba(18,16,12,.22);
    transition:transform .15s ease;
  }
  #go:hover { transform:scale(1.02); }
  #go:active { transform:scale(.98); }
  #go .disc {
    position:absolute; inset:0; border-radius:50%;
    background:
      conic-gradient(from 20deg, transparent 0 62%, rgba(244,236,216,.16) 74%, transparent 86%),
      repeating-radial-gradient(circle at 50% 50%, #191919 0 2px, var(--groove) 2px 4.5px);
    animation:spin 1.8s linear infinite paused;
  }
  #go.rec .disc { animation-play-state:running; }
  #go .label {
    position:absolute; inset:0; margin:auto; width:138px; height:138px; border-radius:50%;
    background:var(--red); color:var(--black);
    display:flex; align-items:center; justify-content:center; text-align:center;
    font:700 13px/1.7 "Space Mono",monospace; letter-spacing:.04em; text-transform:uppercase;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.3), inset 0 0 0 8px rgba(244,236,216,.25);
  }
  #go.rec .label { background:var(--blue); color:#fff; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #go .disc { animation:none; } }

  #auth, #lastfm { margin-top:32px; font:12px/1.5 "Space Mono",monospace; letter-spacing:.06em; text-transform:uppercase; }
  #auth a, #lastfm a { color:var(--blue); font-weight:700; cursor:pointer; }
  #auth input { font:12px "Space Mono",monospace; padding:6px 8px; border:2px solid var(--black); background:#fff; width:210px; }
  #auth form button { padding:7px 12px; font-size:12px; }
  #status { margin-top:26px; font:13px/1.5 "Space Mono",monospace; min-height:1.5em; letter-spacing:.04em; }
  #status:not(:empty)::before { content:'◉ '; color:var(--red); }

  /* --- match card as a record sleeve, disc sliding out --- */
  #result { margin-top:26px; max-width:480px; }
  #result .card {
    position:relative; background:#fff; border:3px solid var(--black);
    box-shadow:10px 10px 0 var(--red); padding:22px 74px 22px 24px; text-align:left;
  }
  #result .card::before { /* the vinyl peeking out of the sleeve */
    content:''; position:absolute; top:24px; right:-40px; width:96px; height:96px; border-radius:50%;
    background:
      conic-gradient(from 200deg, transparent 0 60%, rgba(244,236,216,.18) 72%, transparent 84%),
      repeating-radial-gradient(circle at 50% 50%, #191919 0 1.5px, var(--groove) 1.5px 3.5px);
    box-shadow:5px 5px 0 rgba(18,16,12,.18); z-index:-1;
  }
  #result .card::after { /* its label */
    content:''; position:absolute; top:53px; right:-11px; width:38px; height:38px; border-radius:50%;
    background:var(--red); box-shadow:inset 0 0 0 2px rgba(0,0,0,.3); z-index:-1;
  }
  #result .title { font-family:"Anton",system-ui,sans-serif; font-size:30px; text-transform:uppercase; line-height:1; margin:0; }
  #result .artist { font-size:18px; margin:6px 0 14px; }
  #result .meta { font:12px/1.6 "Space Mono",monospace; letter-spacing:.08em; text-transform:uppercase; color:#555; }
  #result a { color:var(--blue); font:700 12px "Space Mono",monospace; text-transform:uppercase; }
  #result .lk { white-space:nowrap; }
  #result .none { font:13px "Space Mono",monospace; }
  #result button.confirm { margin-top:14px; font:700 12px "Space Mono",monospace; letter-spacing:.06em;
    text-transform:uppercase; background:var(--blue); color:#fff; border:0; padding:12px 18px; cursor:pointer; }
  #result button.confirm:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
  <h1>SPINDLE<span class="s">.</span></h1>
  <p class="tag">Hear it, don't type it</p>
  <button id="go" aria-label="Listen to the record">
    <span class="disc" aria-hidden="true"></span>
    <span class="label" id="golabel">● Listen<br>to the record</span>
  </button>
  <div id="auth"></div>
  <div id="lastfm"></div>
  <div id="status"></div>
  <div id="result"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const go = document.getElementById('go');
const goLabel = document.getElementById('golabel');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const lastfmEl = document.getElementById('lastfm');
const authEl = document.getElementById('auth');
const MAX_S = 15;
let rec, chunks, timer, tick, left, match;
let sb, me, lf; // supabase client, signed-in user, {connected,user}

// --- Supabase session (magic link) ---
async function init() {
  const cfg = await (await fetch('/api/config')).json();
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
    authEl.innerHTML = 'Supabase not configured — set SUPABASE_URL / SUPABASE_ANON_KEY.';
    return;
  }
  sb = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  sb.auth.onAuthStateChange(async (_e, s) => {
    const changed = s?.user?.id !== me?.id;
    me = s?.user ?? null;
    if (changed) await refreshLf();
    renderAuth();
    // A match card rendered while signed out needs its Confirm button once signed in.
    if (changed && me && match && !document.getElementById('save')) {
      render({ status: 'success', result: match });
  statusEl.textContent = 'Match.';
  // Encode the match into the URL: refresh and shareable links re-show this card.
  history.replaceState(null, '', `/?m=${encodeMatch(match)}`);
    }
  });
  const { data: { session } } = await sb.auth.getSession();
  me = session?.user ?? null;
  renderAuth();
  if (me) refreshLf();
  // A match encoded in the URL survives refresh and is shareable.
  const q = new URLSearchParams(location.search).get('m');
  if (q) {
    try {
      render({ status: 'success', result: decodeMatch(q) });
      statusEl.textContent = 'Match (from link).';
    } catch {}
  }
}
init();

function encodeMatch(m) {
  return encodeURIComponent(JSON.stringify({
    title: m.title, artist: m.artist, album: m.album || null,
    release_date: m.release_date || null, label: m.label || null,
    song_link: m.song_link || null, acrid: m.acrid || null,
    platforms: m.platforms || null,
    apple_music: m.apple_music?.url || null,
    spotify: m.spotify?.external_urls?.spotify || null,
  }));
}
function decodeMatch(s) {
  const m = JSON.parse(decodeURIComponent(s));
  if (m.apple_music) m.apple_music = { url: m.apple_music };
  if (m.spotify) m.spotify = { external_urls: { spotify: m.spotify } };
  return m;
}

function token() { return sb ? sb.auth.getSession().then(r => r.data?.session?.access_token) : null; }

async function refreshLf() {
  lf = null;
  if (!me) { renderLastfm(); return; }
  try {
    const r = await fetch('/api/lastfm?status=1', { headers: { authorization: `Bearer ${await token()}` } });
    lf = r.ok ? await r.json() : null;
  } catch {}
  renderLastfm();
}

function renderAuth() {
  if (!me) {
    authEl.innerHTML = `<a id="signin">Sign in to log plays</a>`;
    document.getElementById('signin').onclick = () => {
      authEl.innerHTML = `<form id="oform"><input id="email" type="email" required placeholder="you@example.com"><button>Send magic link</button></form>`;
      document.getElementById('oform').onsubmit = async e => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const { error } = await sb.auth.signInWithOtp({ email });
        authEl.innerHTML = error
          ? esc(error.message)
          : `Magic link sent to ${esc(email)} — check your inbox.`;
      };
    };
  } else {
    authEl.innerHTML = `${esc(me.email)} · <a id="signout">sign out</a>`;
    document.getElementById('signout').onclick = () => sb.auth.signOut();
  }
}

// --- Last.fm connection (session key stored server-side on your profile row) ---
function renderLastfm() {
  if (!me) { lastfmEl.innerHTML = ''; return; }
  lastfmEl.innerHTML = lf?.connected
    ? `Last.fm: ${esc(lf.user)} · <a id="disc">disconnect</a>`
    : `<a id="lfc">Connect Last.fm ↗</a>`;
  const c = document.getElementById('lfc');
  if (c) c.onclick = async () => {
    c.textContent = 'Opening Last.fm…';
    const r = await fetch('/api/lastfm', {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: `Bearer ${await token()}` },
      body: JSON.stringify({ action: 'start' }),
    });
    const d = await r.json();
    if (d.url) location.href = d.url;
    else statusEl.textContent = 'Could not start Last.fm connect.';
  };
  const d = document.getElementById('disc');
  if (d) d.onclick = async () => {
    await fetch('/api/lastfm', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ action: 'disconnect' }),
    });
    refreshLf();
  };
}

go.onclick = () => rec && rec.state === 'recording' ? rec.stop() : start();

async function start() {
  resultEl.innerHTML = '';
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    statusEl.textContent = 'Mic permission denied.';
    return;
  }
  chunks = [];
  rec = new MediaRecorder(stream);
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => { clearTimeout(timer); clearInterval(tick); stream.getTracks().forEach(t => t.stop()); identify(); };
  rec.start();
  go.classList.add('rec');
  goLabel.innerHTML = '■ Stop<br>&amp; identify';
  left = MAX_S;
  statusEl.textContent = `Listening… auto-stop in ${left}s`;
  timer = setTimeout(() => rec.state === 'recording' && rec.stop(), MAX_S * 1000);
  tick = setInterval(() => {
    left--;
    if (left <= 0) return;
    statusEl.textContent = `Listening… auto-stop in ${left}s`;
  }, 1000);
}

async function identify() {
  go.classList.remove('rec');
  goLabel.innerHTML = '● Listen<br>to the record';
  go.disabled = true;
  statusEl.textContent = 'Identifying the pressing…';
  try {
    const blob = new Blob(chunks, { type: 'audio/webm' });
    const r = await fetch('/api/identify', { method: 'POST', body: blob });
    render(await r.json());
  } catch (e) {
    statusEl.textContent = 'Request failed: ' + e;
  } finally {
    go.disabled = false;
  }
}

function render(data) {
  if (data.status !== 'success') {
    statusEl.textContent = 'AudD error: ' + (data.error?.error_message || data.error || 'unknown');
    return;
  }
  match = data.result;
  if (!match) {
    statusEl.textContent = 'No match — try a louder or longer sample.';
    resultEl.innerHTML = '<div class="card"><p class="none">Nothing recognized this time.</p></div>';
    return;
  }
  statusEl.textContent = 'Match.';
  // Per-service links resolved server-side from AudD's song_link via Odesli.
  const p = match.platforms ?? {};
  const items = [
    match.apple_music?.url && `<a href="${match.apple_music.url}" target="_blank" rel="noopener">Apple Music ↗</a>`,
    match.spotify?.external_urls?.spotify && `<a href="${match.spotify.external_urls.spotify}" target="_blank" rel="noopener">Spotify ↗</a>`,
    p.youtubeMusic && `<a href="${p.youtubeMusic}" target="_blank" rel="noopener">YouTube Music ↗</a>`,
    p.youtube && `<a href="${p.youtube}" target="_blank" rel="noopener">YouTube ↗</a>`,
    p.deezer && `<a href="${p.deezer}" target="_blank" rel="noopener">Deezer ↗</a>`,
    p.tidal && `<a href="${p.tidal}" target="_blank" rel="noopener">Tidal ↗</a>`,
  ].filter(Boolean);
  // Each link + separator is one unbreakable unit; lines wrap between units only.
  const links = items.map((a, i) => `<span class="lk">${a}${i < items.length - 1 ? '\u00A0·' : ''}</span>`).join(' ');
  const action = me
    ? '<button class="confirm" id="save">Confirm &amp; log</button>'
    : '<p class="meta" style="margin-top:12px">Sign in above to log this play.</p>';
  resultEl.innerHTML = `<div class="card">
    <p class="title">${esc(match.title)}</p>
    <p class="artist">${esc(match.artist)}</p>
    <p class="meta">${esc(match.album || '')}${match.release_date ? ' · ' + esc(match.release_date) : ''}${match.label ? ' · ' + esc(match.label) : ''}</p>
    ${links ? '<p style="margin-top:12px">' + links + '</p>' : ''}
    ${action}
  </div>`;
  const btn = document.getElementById('save');
  if (btn) btn.onclick = () => save(btn);
}

async function save(btn) {
  btn.disabled = true;
  btn.textContent = 'Logging…';
  try {
    // One row per distinct recording: AudD's fingerprint id, else artist|title|album.
    const pressing = {
      dedupe_key: match.acrid || [match.artist, match.title, match.album].join('|').toLowerCase(),
      artist: match.artist,
      title: match.title,
      album: match.album || null,
      release_date: match.release_date || null,
      label: match.label || null,
      apple_music_url: match.apple_music?.url || null,
      spotify_url: match.spotify?.external_urls?.spotify || null,
    };
    const { data: p, error } = await sb.from('pressings')
      .upsert(pressing, { onConflict: 'dedupe_key' }).select().single();
    if (error) throw error;
    const ins = await sb.from('plays').insert({
      pressing_id: p.id,
      played_at: new Date().toISOString(),
      raw: match,
    });
    if (ins.error) throw ins.error;

    if (lf?.connected) {
      btn.textContent = 'Scrobbling…';
      let ok = false;
      try {
        const r = await fetch('/api/lastfm', {
          method: 'POST',
          headers: { 'content-type': 'application/json', authorization: `Bearer ${await token()}` },
          body: JSON.stringify({
            artist: match.artist, track: match.title, album: match.album,
            timestamp: Math.floor(Date.now() / 1000),
          }),
        });
        const d = await r.json().catch(() => null);
        ok = d?.scrobbles?.['@attr']?.accepted > 0 || d?.scrobbles?.scrobble;
      } catch {}
      btn.textContent = ok ? '✓ Logged & scrobbled' : '✓ Logged · scrobble failed';
    } else {
      btn.textContent = '✓ Logged';
    }
  } catch (e) {
    statusEl.textContent = 'Save failed: ' + (e?.message || e);
    btn.disabled = false;
    btn.textContent = 'Confirm & log';
  }
}

function esc(s) { return String(s ?? '').replace(/[<>&]/g, c => ({ '<':'&lt;','>':'&gt;','&':'&amp;' }[c])); }
</script>
</body>
</html>
